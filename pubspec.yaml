name: flutter_reels_video
description: >
  A minimal, reusable vertical video reels pager (PageView-based) with
  autoplay, preloading and pagination support.
version: 0.0.1
homepage: https://github.com/MrTuyennn/flutter_reels_video
repository: https://github.com/MrTuyennn/flutter_reels_video
issue_tracker: https://github.com/MrTuyennn/flutter_reels_video/issues

environment:
  sdk: ">=3.1.3 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.5
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
